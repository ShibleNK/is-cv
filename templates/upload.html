<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edge Detection App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
    <div class="mx-auto max-w-5xl px-4 py-12">
        <h1 class="mb-8 text-center text-3xl font-semibold tracking-tight text-slate-900">
            Upload an Image for Edge Detection
        </h1>
        <div class="flex justify-center">
            <div class="w-full md:w-1/2">
                <form method="post" enctype="multipart/form-data"
                      class="space-y-5 rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
                    <div>
                        <label for="file" class="mb-2 block text-sm font-medium text-slate-700">
                            Choose an image
                        </label>
                        <input type="file" name="file" id="file" accept="image/*" required
                               class="block w-full cursor-pointer rounded-md border border-slate-300 bg-white text-sm text-slate-600
                                      file:mr-4 file:cursor-pointer file:border-0 file:bg-slate-100 file:px-4 file:py-2
                                      file:text-sm file:font-medium file:text-slate-700 hover:file:bg-slate-200
                                      focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <button type="submit"
                            class="w-full rounded-md bg-blue-600 px-4 py-2.5 text-sm font-medium text-white transition
                                   hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                        Upload and process
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
